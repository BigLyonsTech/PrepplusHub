services:
  - type: web
    name: prepplushub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: prepplushub_marketplace
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_OTP_EXPOSE_IN_RESPONSE
        value: "false"
      - key: APP_SEED_ENABLED
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
