spring.application.name=prepplushub-backend
server.port=${PORT:8080}

# MongoDB — start a local instance or set MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/prepplushub_marketplace}
# Spring Boot 4.1 / spring-data-mongodb 5.1 doesn't reliably parse the database
# out of the URI's path segment, so it's pinned explicitly here too.
spring.data.mongodb.database=${MONGODB_DATABASE:prepplushub_marketplace}

# JWT
app.jwt.secret=${JWT_SECRET:prepplushub-dev-secret-change-me-in-production-must-be-at-least-256-bits-long!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OTP — emailed via SMTP below when configured; otherwise EmailService.sendOtp
# fails and AuthService falls back to console-printing + returning it in the
# API response automatically. This flag forces that fallback even when SMTP
# is configured; leave false in production.
app.otp.length=6
app.otp.expiration-minutes=10
app.otp.expose-in-response=${APP_OTP_EXPOSE_IN_RESPONSE:false}

# SMTP — leave MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD unset to keep OTP in
# dev-mode fallback (console + API response) instead of emailing it.
# spring.mail.host must always resolve to *some* property value (even empty)
# or Spring Boot's mail autoconfiguration won't create a JavaMailSender bean.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:PrepplusHub <no-reply@prepplushub.com>}

# CORS — Vite dev server
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Seed demo catalog + admin on startup
app.seed.enabled=true

# Admin account seeded on first boot — no insecure default; unset means a
# random password is generated and logged once at boot instead.
app.admin-seed.password=${ADMIN_SEED_PASSWORD:}

# AI chat support — blank key disables the feature gracefully
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-5}
