spring.application.name=prepplushub-backend
server.port=${PORT:8080}

# MongoDB — start a local instance or set MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/prepplushub_marketplace}
# Spring Boot 4.1 / spring-data-mongodb 5.1 doesn't reliably parse the database
# out of the URI's path segment, so it's pinned explicitly here too.
spring.data.mongodb.database=${MONGODB_DATABASE:prepplushub_marketplace}

# JWT
app.jwt.secret=${JWT_SECRET:prepplushub-dev-secret-change-me-in-production-must-be-at-least-256-bits-long!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OTP — emailed via Resend below when configured; otherwise EmailService.sendOtp
# fails and AuthService falls back to console-printing + returning it in the
# API response automatically. This flag forces that fallback even when Resend
# is configured; leave false in production.
app.otp.length=6
app.otp.expiration-minutes=10
app.otp.expose-in-response=${APP_OTP_EXPOSE_IN_RESPONSE:false}

# Email — sent via Resend's HTTP API, not SMTP (Render blocks outbound SMTP
# ports on its plans, so JavaMailSender could never connect regardless of
# credentials). Leave RESEND_API_KEY unset to keep OTP in dev-mode fallback
# (console + API response) instead of emailing it. Sending to arbitrary
# recipients (guest order confirmations) needs a verified sending domain on
# Resend — until then the default onboarding@resend.dev sender can only
# reach the Resend account's own verified email.
app.notifications.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:PrepplusHub <onboarding@resend.dev>}

# Admin notifications (new orders, new vendor applications) — sent via Resend
# above; silently skipped if it isn't configured, same as OTP.
app.notifications.admin-email=${ADMIN_NOTIFICATION_EMAIL:admin@prepplushub.com}

# Used to build links back into the site from notification emails
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# CORS — Vite dev server
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Seed demo catalog + admin on startup
app.seed.enabled=true

# Admin account seeded on first boot — no insecure default; unset means a
# random password is generated and logged once at boot instead.
app.admin-seed.password=${ADMIN_SEED_PASSWORD:}

# AI chat support — blank key disables the feature gracefully
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-5}

# Delivery-address geocoding for order tracking map — blank key disables the
# feature gracefully (checkout still works, the map pin just doesn't appear)
google.maps.geocoding-api-key=${GOOGLE_MAPS_GEOCODING_API_KEY:}
