[build]
  base = "marketplace-frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_CLOUDINARY_CLOUD_NAME = "fsqiu2ll"
  # VITE_GOOGLE_MAPS_API_KEY is set via the Netlify dashboard/CLI, not here —
  # a prior key committed to this file got caught by GitHub secret scanning.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
